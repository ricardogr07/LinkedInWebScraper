name: Release

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
      - Docs
    branches:
      - main
    types:
      - completed

permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha || github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    name: Evaluate release gate
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
      publish_pypi: ${{ steps.guard.outputs.publish_pypi }}
      create_release: ${{ steps.guard.outputs.create_release }}
      version: ${{ steps.guard.outputs.version }}
      tag_name: ${{ steps.guard.outputs.tag_name }}
      commitish: ${{ steps.guard.outputs.commitish }}
      reason: ${{ steps.guard.outputs.reason }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Evaluate release gate
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          from typing import Any

          import requests

          from linkedin_web_scraper.application.release_manager import (
              build_release_gate,
              read_project_version,
              release_tag,
          )

          def github_headers() -> dict[str, str]:
              return {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              }

          def request_json(
              path: str,
              *,
              params: dict[str, Any] | None = None,
              allow_404: bool = False,
          ) -> dict[str, Any] | None:
              url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/{path}"
              response = requests.get(url, headers=github_headers(), params=params, timeout=30)
              if allow_404 and response.status_code == 404:
                  return None
              response.raise_for_status()
              return response.json()

          def emit(outputs: dict[str, str]) -> None:
              output_path = os.environ["GITHUB_OUTPUT"]
              with open(output_path, "a", encoding="utf-8") as handle:
                  for key, value in outputs.items():
                      handle.write(f"{key}={value}\n")

          def bool_text(value: bool) -> str:
              return "true" if value else "false"

          event_name = os.environ["EVENT_NAME"]
          current_version = read_project_version()
          tag_name = release_tag(current_version)
          commitish = os.environ.get("HEAD_SHA") or os.environ["GITHUB_SHA"]
          should_run = False
          publish_pypi = False
          create_release = False
          reason = ""

          if event_name == "workflow_dispatch":
              ref_name = os.environ.get("GITHUB_REF_NAME") or ""
              if ref_name != "main":
                  reason = "Manual release dispatch must run from main."
              else:
                  latest_release = request_json("releases/latest", allow_404=True)
                  latest_version = None if latest_release is None else latest_release["tag_name"]
                  release_exists = (
                      request_json(f"releases/tags/{tag_name}", allow_404=True) is not None
                  )
                  gate = build_release_gate(
                      current_version,
                      latest_version,
                      ci_success=True,
                      docs_success=True,
                      release_exists=release_exists,
                  )
                  should_run = gate.should_auto_release
                  publish_pypi = gate.should_auto_release
                  create_release = gate.should_auto_release
                  reason = gate.reason
          elif event_name == "workflow_run":
              head_branch = os.environ.get("HEAD_BRANCH") or ""
              trigger_conclusion = os.environ.get("TRIGGER_CONCLUSION") or ""
              head_sha = os.environ.get("HEAD_SHA") or ""

              if head_branch != "main" or trigger_conclusion != "success" or not head_sha:
                  reason = "Workflow run did not complete successfully on main."
              else:
                  runs = request_json(
                      "actions/runs",
                      params={
                          "head_sha": head_sha,
                          "branch": "main",
                          "status": "completed",
                          "per_page": 100,
                      },
                  )
                  workflow_runs = [] if runs is None else runs.get("workflow_runs", [])
                  ci_success = any(
                      run.get("name") == "CI" and run.get("conclusion") == "success"
                      for run in workflow_runs
                  )
                  docs_success = any(
                      run.get("name") == "Docs" and run.get("conclusion") == "success"
                      for run in workflow_runs
                  )

                  if not (ci_success and docs_success):
                      reason = "Waiting for both CI and Docs to complete successfully for this commit."
                  else:
                      latest_release = request_json("releases/latest", allow_404=True)
                      latest_version = None if latest_release is None else latest_release["tag_name"]
                      release_exists = (
                          request_json(f"releases/tags/{tag_name}", allow_404=True) is not None
                      )
                      gate = build_release_gate(
                          current_version,
                          latest_version,
                          ci_success=ci_success,
                          docs_success=docs_success,
                          release_exists=release_exists,
                      )
                      should_run = gate.should_auto_release
                      publish_pypi = gate.should_auto_release
                      create_release = gate.should_auto_release
                      reason = gate.reason
          else:
              reason = f"Unsupported event: {event_name}"

          emit(
              {
                  "should_run": bool_text(should_run),
                  "publish_pypi": bool_text(publish_pypi),
                  "create_release": bool_text(create_release),
                  "version": current_version,
                  "tag_name": tag_name,
                  "commitish": commitish,
                  "reason": reason,
              }
          )
          print(reason)
          PY

  build:
    name: Build distributions
    needs: guard
    if: ${{ needs.guard.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Build package
        run: python -m tox -e build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs:
      - guard
      - build
    if: ${{ needs.guard.outputs.create_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Create release and upload artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.guard.outputs.tag_name }}
          target_commitish: ${{ needs.guard.outputs.commitish }}
          name: ${{ needs.guard.outputs.tag_name }}
          generate_release_notes: true
          files: dist/*

  publish-pypi:
    name: Publish to PyPI
    needs:
      - guard
      - build
      - create-release
    if: ${{ needs.guard.outputs.publish_pypi == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/LinkedInWebScraper/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/