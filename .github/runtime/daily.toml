[logging]
level = "INFO"
file_name = "daily-github-actions.log"

[storage]
file_name = "linkedin_jobs.sqlite"
state_dir = "artifacts/state"

[scrape.daily]
cities = ["Monterrey", "Guadalajara", "Mexico City"]
position = "Data Scientist"
openai_enabled = true
enrichment_required = true
openai_model = "gpt-4o-mini"
time_posted = "DAY"
output_dir = "artifacts/jobs"
combined_file_name = "linkedin_jobs_daily_mexico.csv"

[export]
file_name = "linkedin_jobs_export.csv"
output_dir = "artifacts/jobs"