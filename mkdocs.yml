site_name: LinkedInWebScraper
site_description: A production-minded LinkedIn jobs scraping library.
site_url: https://github.com/ricardogr07/LinkedInWebScraper
repo_url: https://github.com/ricardogr07/LinkedInWebScraper
edit_uri: edit/main/docs/
docs_dir: docs
theme:
  name: material
nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - API Reference: api.md
  - Internal:
      - Validation: development/validation.md
      - Codex:
          - Overview: codex/index.md
          - Subagents: codex/subagents.md
          - Skills: codex/skills.md
          - Tools and commands: codex/tools-and-commands.md
          - Integrations: codex/integrations.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_source: false
