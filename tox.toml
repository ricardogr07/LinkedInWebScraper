requires = ["tox>=4.21.2"]
env_list = ["py311", "py312", "py313", "py314", "lint", "type", "docs", "build"]
skip_missing_interpreters = true

[env_run_base]
package = "wheel"
deps = [
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
]
commands = [["pytest", "-ra"]]

[env.py311]

[env.py312]

[env.py313]

[env.py314]

[env.lint]
deps = ["ruff>=0.6.9"]
commands = [
  ["ruff", "check", "."],
  ["ruff", "format", "--check", "."],
]

[env.type]
deps = ["pyrefly>=0.26.0"]
commands = [["pyrefly", "check", "src/Utils/file_manager.py", "src/Utils/logger.py"]]

[env.docs]
deps = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.5.34",
  "mkdocstrings[python]>=0.26.1",
]
commands = [["mkdocs", "build", "--strict"]]

[env.build]
deps = ["build>=1.2.2"]
commands = [["python", "-m", "build"]]
